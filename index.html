<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#101523">
  <title>游乐星球 · 家庭游戏乐园</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#273858 0%,#111827 68%);color:#f7f8ff}
    canvas{position:absolute;inset:0;margin:auto;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);display:block}
    #hint{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);padding:9px 16px;border:1px solid #ffffff1c;border-radius:999px;background:#101827b8;color:#d9e2f4;text-align:center;font:12px/1.4 Inter,"PingFang SC",sans-serif;backdrop-filter:blur(12px);pointer-events:none}
    #music-toggle{position:fixed;top:18px;right:18px;width:auto;height:40px;padding:0 14px;border-radius:999px;background:#17253ddd;font:600 12px Inter,"PingFang SC",sans-serif;letter-spacing:.02em}
    #music-toggle[aria-pressed="false"]{color:#aab6ca}
    #touch{position:fixed;inset:auto 0 20px;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
    .cluster{display:flex;gap:9px;pointer-events:auto}
    button{width:54px;height:50px;border:1px solid #ffffff42;border-radius:16px;background:#17253ddd;color:#fff;font:700 20px Inter,sans-serif;box-shadow:0 6px 18px #0005;touch-action:none}
    button:active{background:#6385c9}
    .action{width:64px;border-radius:18px;background:#edaa55;color:#1d2230;font-size:15px}
    @media(hover:hover) and (pointer:fine){#touch{opacity:.18;transition:opacity .2s}#touch:hover{opacity:.9}}
    @media(min-width:800px) and (hover:hover) and (pointer:fine){#touch{display:none}#hint{bottom:20px}}
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540" aria-label="游乐星球游戏画面"></canvas>
  <div id="hint">方向键移动　·　空格跳跃 / 射击　·　Esc 返回大厅　·　P 暂停</div>
  <button id="music-toggle" type="button" aria-label="关闭背景音乐" aria-pressed="true">♫ 音乐开</button>
  <div id="touch" aria-label="触屏操作">
    <div class="cluster">
      <button data-key="ArrowLeft" aria-label="向左">←</button>
      <button data-key="ArrowRight" aria-label="向右">→</button>
      <button data-key="ArrowUp" aria-label="跳跃">↑</button>
    </div>
    <div class="cluster">
      <button data-key="Escape" aria-label="返回">↩</button>
      <button class="action" data-key="Space" aria-label="操作">行动</button>
    </div>
  </div>
  <script>
    const canvas=document.getElementById('game');
    const ctx=canvas.getContext('2d');
    const W=960,H=540;
    const keys={},justPressed=new Set();
    const names=['霓虹飞车','星际突击','星芽远征','弹珠工坊','银河守卫','小蛇大冒险','果园派对'];
    const icons=['🏎️','🚀','🌱','🪄','🛸','🐍','🍓'];
    const palettes=['#ff748d','#f4ae55','#70d7a5','#71c6ed','#b29aff','#6bd5c5','#ff9e72'];
    const random=(min,max)=>min+Math.random()*(max-min);
    const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
    let scene='menu',selected=0,game=null,paused=false,last=0,frame=0;
    let highScores={};
    try{highScores=JSON.parse(localStorage.getItem('arcadeHighScores')||'{}')}catch(error){console.warn('无法读取本地最高分。',error)}
    const musicTracks=[
      {tempo:148,root:48,lead:[0,7,12,7,4,7,11,7,2,9,14,9,7,4,2,4],bass:[0,0,7,0,4,4,7,4]},
      {tempo:116,root:45,lead:[0,3,7,10,12,10,7,3,5,8,12,15,14,12,8,5],bass:[0,0,5,7,0,0,8,7]},
      {tempo:132,root:52,lead:[0,4,7,12,11,7,4,7,2,5,9,14,12,9,5,2],bass:[0,7,0,7,5,12,5,12]},
      {tempo:164,root:55,lead:[0,7,12,16,12,7,4,7,2,9,14,17,14,9,7,4],bass:[0,0,7,0,5,5,7,5]},
      {tempo:108,root:43,lead:[0,7,10,14,12,10,7,5,3,10,14,17,15,14,10,7],bass:[0,0,3,7,0,0,5,7]},
      {tempo:124,root:50,lead:[0,3,7,10,7,3,5,8,12,8,5,3,2,5,9,5],bass:[0,3,7,3,5,8,12,8]},
      {tempo:140,root:53,lead:[0,4,9,12,9,7,4,7,5,9,12,16,12,9,7,4],bass:[0,0,5,0,4,4,7,4]}
    ];
    const musicButton=document.getElementById('music-toggle');
    let audioContext=null,musicGain=null,musicTimer=null,musicTrack=-1,musicStep=0,nextMusicBeat=0,musicMuted=false;

    function ensureAudio(){
      if(!audioContext){
        const AudioContextClass=window.AudioContext||window.webkitAudioContext;
        if(!AudioContextClass){
          musicButton.textContent='音频不可用';
          musicButton.disabled=true;
          return false;
        }
        audioContext=new AudioContextClass();
        musicGain=audioContext.createGain();
        musicGain.gain.value=0;
        musicGain.connect(audioContext.destination);
      }
      if(audioContext.state==='suspended')audioContext.resume().catch(error=>console.warn('无法启动背景音乐。',error));
      return true;
    }
    function noteFrequency(midi){return 440*Math.pow(2,(midi-69)/12)}
    function playTone(midi,when,duration,wave,volume){
      if(!audioContext||!musicGain||musicMuted)return;
      const oscillator=audioContext.createOscillator();
      const envelope=audioContext.createGain();
      oscillator.type=wave;
      oscillator.frequency.setValueAtTime(noteFrequency(midi),when);
      envelope.gain.setValueAtTime(.0001,when);
      envelope.gain.exponentialRampToValueAtTime(volume,when+.012);
      envelope.gain.exponentialRampToValueAtTime(.0001,when+duration);
      oscillator.connect(envelope);
      envelope.connect(musicGain);
      oscillator.start(when);
      oscillator.stop(when+duration+.015);
    }
    function scheduleMusic(){
      if(!audioContext||musicTrack<0||scene!=='play'||paused||game?.over||game?.cleared)return;
      const track=musicTracks[musicTrack],beat=60/track.tempo;
      while(nextMusicBeat<audioContext.currentTime+.12){
        const step=musicStep%track.lead.length;
        const melody=track.lead[step];
        if(melody!==null)playTone(track.root+melody,nextMusicBeat,beat*.72,'square',.035);
        if(step%2===0){
          const bass=track.bass[(step/2)%track.bass.length];
          playTone(track.root-12+bass,nextMusicBeat,beat*.9,'triangle',.055);
        }
        if(step===0||step===8){
          playTone(track.root+12+track.lead[step],nextMusicBeat,beat*1.5,'triangle',.018);
        }
        nextMusicBeat+=beat/2;
        musicStep++;
      }
    }
    function setMusicTrack(index){
      if(!ensureAudio())return;
      musicTrack=index;musicStep=0;nextMusicBeat=audioContext.currentTime+.06;
      if(musicTimer===null)musicTimer=window.setInterval(scheduleMusic,40);
      musicGain.gain.cancelScheduledValues(audioContext.currentTime);
      musicGain.gain.setTargetAtTime(musicMuted||paused?0.0001:0.8,audioContext.currentTime,.12);
      updateMusicButton();
    }
    function updateMusicButton(){
      musicButton.textContent=musicMuted?'♫ 音乐关':'♫ 音乐开';
      musicButton.setAttribute('aria-pressed',String(!musicMuted));
      musicButton.setAttribute('aria-label',musicMuted?'开启背景音乐':'关闭背景音乐');
    }
    function toggleMusic(){
      if(!ensureAudio())return;
      musicMuted=!musicMuted;
      if(musicGain)musicGain.gain.setTargetAtTime(musicMuted?0.0001:scene==='play'&&!paused?0.8:0,audioContext.currentTime,.08);
      updateMusicButton();
    }

    function rect(x,y,w,h,color){
      ctx.fillStyle=color;
      ctx.fillRect(x,y,w,h);
    }
    function rounded(x,y,w,h,r,color,stroke){
      ctx.beginPath();
      ctx.roundRect(x,y,w,h,r);
      ctx.fillStyle=color;
      ctx.fill();
      if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
    }
    function text(value,x,y,size=18,color='#fff',align='left',weight=700){
      ctx.fillStyle=color;
      ctx.font=`${weight} ${size}px Inter,"PingFang SC","Microsoft YaHei",sans-serif`;
      ctx.textAlign=align;
      ctx.textBaseline='alphabetic';
      ctx.fillText(value,x,y);
    }
    function gradient(y1,y2,stops){
      const fill=ctx.createLinearGradient(0,y1,0,y2);
      for(const [point,color] of stops)fill.addColorStop(point,color);
      return fill;
    }
    function pressed(key){return justPressed.has(key)}
    function held(...list){return list.some(key=>keys[key]||justPressed.has(key))}
    function action(){return pressed('Space')||pressed('Enter')}

    function buildLevel(kind,level){
      const width=9600;
      const world={width,platforms:[],coins:[],enemies:[],obstacles:[],blocks:[],checkpoints:[],boss:null,seed:Math.random()};
      if(kind===2){
        let cursor=0;
        while(cursor<width){
          const gap=cursor>430&&Math.random()<.2?random(45,92):0;
          cursor+=gap;
          const span=random(190,310);
          const top=random(414,458);
          world.platforms.push({x:cursor,w:Math.min(span,width-cursor),y:top});
          if(cursor>140&&cursor<width-250&&Math.random()<.72){
            world.coins.push({x:cursor+random(48,Math.max(54,span-30)),y:top-random(72,116),taken:false});
          }
          if(cursor>350&&cursor<width-600&&Math.random()<.36){
            world.enemies.push({x:cursor+random(36,Math.max(42,span-38)),y:top-32,min:cursor+8,max:cursor+span-38,dir:Math.random()<.5?-1:1,speed:random(28,48)+level*2,alive:true});
          }
          if(cursor>240&&cursor<width-800&&Math.random()<.62){
            const blockX=cursor+random(52,Math.max(58,span-44));
            world.blocks.push({x:blockX,y:top-random(104,130),state:'sealed',bump:0});
            if(Math.random()<.65)world.coins.push({x:blockX+20,y:top-random(159,190),taken:false});
          }
          if(cursor>900&&Math.random()<.18){
            world.checkpoints.push({x:cursor+span*.55,y:top-56,active:false});
          }
          cursor+=span;
        }
        world.platforms.unshift({x:0,w:420,y:450});
        world.platforms.push({x:width-780,w:780,y:438});
        world.checkpoints.push({x:width*.5,y:390,active:false});
        world.boss={x:width-430,y:438-78,baseY:438-78,w:96,h:78,hp:3,maxHp:3,dir:-1,speed:38+level*3,min:width-540,max:width-285,flash:0};
        world.flagX=width-116;
      }else{
        for(let i=0;i<36;i++){
          const x=320+i*230+random(-45,45);
          world.obstacles.push({x,y:random(356,436),w:random(46,90),h:random(35,112),tone:i%3});
          if(i%3!==1)world.enemies.push({x:x+random(105,165),y:420,min:x+90,max:x+205,speed:random(25,48)+level*3,dir:-1,alive:true,hp:1});
        }
        world.coins=Array.from({length:36},(_,i)=>({x:random(240+i*250,430+i*250),y:random(300,420),taken:false}));
        world.boss={x:width-430,y:365,w:128,h:124,hp:7+level*2,maxHp:7+level*2,shotTimer:1.5};
      }
      return world;
    }

    function start(index,level=1,score=0,life=3){
      selected=index;scene='play';paused=false;frame=0;
      game={score,life,level,t:0,over:false,win:false,cleared:false,px:index===2?90:180,py:410,vx:0,vy:0,cool:0,camera:0,checkpointX:90,invulnerable:0,objects:[],shots:[],enemies:[],enemyShots:[],world:null};
      if(index===1||index===2)game.world=buildLevel(index,level);
      if(index===3){
        game.px=440;game.ball={x:480,y:350,vx:3,vy:-4};game.bricks=[];
        for(let row=0;row<6;row++)for(let col=0;col<14;col++)game.bricks.push({x:38+col*63,y:90+row*27,alive:true,row});
      }
      if(index===4){game.px=455;game.py=430}
      if(index===5){game.snake=[{x:16,y:12},{x:15,y:12},{x:14,y:12}];game.dir={x:1,y:0};game.next={x:1,y:0};game.food={x:25,y:12};game.step=0;game.life=1}
      if(index===6){game.px=440;game.life=3}
      setMusicTrack(index);
      updateHint();
    }
    function updateHint(){
      const hint=document.getElementById('hint');
      hint.textContent=scene==='menu'?'← → 选择游戏　·　空格开始　·　手机可使用屏幕按钮':selected===2?'← → 移动　·　↑ / 空格 跳跃　·　踩敌人 / 顶星芽箱　·　击败关底守卫':selected===1?'← → 移动　·　空格射击　·　击败关底 Boss 进入随机新关':'方向键移动　·　空格跳跃 / 射击　·　Esc 返回大厅　·　P 暂停';
    }
    function saveScore(){
      highScores[selected]=Math.max(highScores[selected]||0,game.score);
      try{localStorage.setItem('arcadeHighScores',JSON.stringify(highScores))}catch(error){console.warn('无法保存本地最高分。',error)}
    }
    function loseLife(){
      game.life--;
      if(game.life<=0){game.over=true;saveScore();fadeMusic()}
    }
    function fadeMusic(){
      if(musicGain&&audioContext)musicGain.gain.setTargetAtTime(0,audioContext.currentTime,.18);
    }
    function overlap(a,b,w,h,c,d,e,f){return a<c+e&&a+w>c&&b<d+f&&b+h>d}
    function nextStage(){
      start(selected,game.level+1,game.score,game.life);
    }
    function updateLongGame(dt){
      const g=game,world=g.world;
      g.cool=Math.max(0,g.cool-dt);
      if(g.cleared){fadeMusic();if(action())nextStage();return}
      if(selected===2){
        const oldY=g.py;
        g.invulnerable=Math.max(0,g.invulnerable-dt);
        g.px=clamp(g.px+(held('ArrowLeft')?-260*dt:0)+(held('ArrowRight')?260*dt:0),0,world.width-32);
        if((held('ArrowUp','Space','Enter'))&&g.onGround){g.vy=-530;g.onGround=false}
        g.vy+=1450*dt;g.py+=g.vy*dt;g.onGround=false;
        for(const platform of world.platforms){
          if(g.px+30>platform.x&&g.px<platform.x+platform.w&&g.vy>=0&&oldY+38<=platform.y+8&&g.py+38>=platform.y){
            g.py=platform.y-38;g.vy=0;g.onGround=true;
          }
        }
        for(const block of world.blocks){
          block.bump=Math.max(0,block.bump-dt);
          const blockY=block.y-(block.bump>0?Math.sin(block.bump*32)*5:0);
          if(g.vy<0&&oldY>=blockY+24&&g.py<=blockY+24&&g.px+30>block.x&&g.px<block.x+40){
            g.py=blockY+24;g.vy=110;block.bump=.18;
            if(block.state==='sealed'){block.state='opened';g.score+=20;world.coins.push({x:block.x+20,y:block.y-18,taken:false,bonus:true})}
            else if(block.state==='opened'){g.score+=5}
          }
        }
        for(const coin of world.coins)if(!coin.taken&&overlap(g.px,g.py,30,38,coin.x-11,coin.y-11,22,22)){coin.taken=true;g.score+=10}
        for(const enemy of world.enemies)if(enemy.alive){
          enemy.x+=enemy.dir*enemy.speed*dt;
          if(enemy.x<enemy.min||enemy.x>enemy.max)enemy.dir*=-1;
          if(overlap(g.px,g.py,30,38,enemy.x,enemy.y,28,28)){
            if(g.vy>40&&oldY+38<enemy.y+13){enemy.alive=false;g.vy=-300;g.score+=25}
            else if(g.invulnerable===0){g.px=Math.max(g.checkpointX,g.px-80);g.invulnerable=1.1;loseLife()}
          }
        }
        for(const checkpoint of world.checkpoints)if(!checkpoint.active&&g.px>=checkpoint.x){
          checkpoint.active=true;g.checkpointX=checkpoint.x;g.score+=50;
        }
        const boss=world.boss;
        if(boss){
          boss.x+=boss.dir*boss.speed*dt;
          if(boss.x<boss.min||boss.x>boss.max)boss.dir*=-1;
          boss.flash=Math.max(0,boss.flash-dt);
          boss.hitCooldown=Math.max(0,(boss.hitCooldown||0)-dt);
          const bossTopContact=g.px+30>boss.x&&g.px<boss.x+boss.w&&g.vy>=0&&oldY+38<=boss.y+8&&g.py+38>=boss.y;
          if(bossTopContact){
            if(g.vy>35&&boss.hitCooldown===0){
              boss.hp--;boss.hitCooldown=.72;boss.flash=.24;g.vy=-390;g.score+=100;
              if(boss.hp<=0){world.boss=null;g.cleared=true;saveScore();fadeMusic()}
            }else{g.py=boss.y-38;g.vy=0;g.onGround=true}
          }else if(overlap(g.px,g.py,30,38,boss.x,boss.y,boss.w,boss.h)&&g.py+38>boss.y+14&&g.invulnerable===0){
              g.px=Math.max(g.checkpointX,boss.x-38);g.invulnerable=1.1;loseLife();
          }
        }
        if(g.py>H+120){loseLife();g.px=g.checkpointX;g.py=260;g.vy=0;g.invulnerable=.8}
        if(world.boss===null&&g.px+25>=world.flagX){g.cleared=true;saveScore();fadeMusic()}
      }else{
        g.px=clamp(g.px+(held('ArrowLeft')?-250*dt:0)+(held('ArrowRight')?250*dt:0),0,world.width-40);
        if(held('ArrowUp','ArrowDown'))g.py=clamp(g.py+(held('ArrowUp')?-120*dt:0)+(held('ArrowDown')?120*dt:0),318,446);
        if(held('Space','Enter')&&g.cool===0){g.shots.push({x:g.px+42,y:g.py+18});g.cool=.2}
        for(const shot of g.shots)shot.x+=630*dt;
        for(const enemy of world.enemies)if(enemy.alive){
          enemy.x+=enemy.dir*enemy.speed*dt;
          if(enemy.x<enemy.min||enemy.x>enemy.max)enemy.dir*=-1;
          if(overlap(g.px,g.py,36,38,enemy.x,enemy.y,30,34)){enemy.alive=false;loseLife()}
          for(const shot of g.shots)if(enemy.alive&&overlap(shot.x,shot.y,18,7,enemy.x,enemy.y,30,34)){enemy.alive=false;shot.x=world.width+100;g.score+=15}
        }
        for(const obstacle of world.obstacles)if(overlap(g.px,g.py,36,38,obstacle.x,obstacle.y,obstacle.w,obstacle.h)){
          if(g.px+24<obstacle.x+obstacle.w/2)g.px=obstacle.x-40;else g.px=obstacle.x+obstacle.w+2;
        }
        const boss=world.boss;
        if(boss&&overlap(g.px,g.py,36,38,boss.x,boss.y,boss.w,boss.h)){g.px=boss.x-44;loseLife()}
        if(boss){
          boss.shotTimer-=dt;
          if(boss.shotTimer<=0){g.enemyShots.push({x:boss.x,y:boss.y+55});boss.shotTimer=random(.9,1.7)}
          for(const shot of g.shots)if(overlap(shot.x,shot.y,18,7,boss.x,boss.y,boss.w,boss.h)){
            shot.x=world.width+100;boss.hp--;g.score+=20;
          }
          if(boss.hp<=0){world.boss=null;g.cleared=true;saveScore();fadeMusic()}
        }
        for(const shot of g.enemyShots){
          shot.x-=320*dt;
          if(overlap(g.px,g.py,36,38,shot.x,shot.y,19,14)){shot.x=-100;loseLife()}
        }
        g.shots=g.shots.filter(shot=>shot.x<world.width+40);
        g.enemyShots=g.enemyShots.filter(shot=>shot.x>-40);
        for(const coin of world.coins)if(!coin.taken&&overlap(g.px,g.py,36,38,coin.x,coin.y,18,18)){coin.taken=true;g.score+=10}
        if(g.px>=world.width-85&&world.boss){g.px=world.width-85}
      }
      g.camera=clamp(g.px-280,0,world.width-W);
    }

    function update(dt){
      if(scene==='menu'){
        if(pressed('ArrowLeft')||pressed('ArrowUp'))selected=(selected+6)%7;
        if(pressed('ArrowRight')||pressed('ArrowDown'))selected=(selected+1)%7;
        if(action())start(selected);
        return;
      }
      if(pressed('Escape')||pressed('Backspace')){scene='menu';fadeMusic();updateHint();return}
      if(pressed('KeyP')){
        paused=!paused;
        if(musicGain&&audioContext)musicGain.gain.setTargetAtTime(musicMuted||paused?0.0001:0.8,audioContext.currentTime,.1);
      }
      if(paused)return;
      if(game.over){if(action())start(selected);return}
      game.t+=dt;
      if(selected===1||selected===2){updateLongGame(dt);return}
      game.cool=Math.max(0,game.cool-dt);
      if(selected===0){
        game.px=clamp(game.px+(held('ArrowLeft')?-390*dt:0)+(held('ArrowRight')?390*dt:0),180,740);
        if(Math.random()<dt*(1.2+game.score/150))game.objects.push({x:random(200,740),y:-60,color:Math.random()<.5?'#ff6789':'#ffd26d'});
        for(const object of game.objects){object.y+=250*dt;if(overlap(game.px,424,40,54,object.x,object.y,38,54)){object.y=700;loseLife()}if(object.y>H&&!object.passed){object.passed=true;game.score+=5}}
        game.objects=game.objects.filter(object=>object.y<600);
      }
      if(selected===3){
        game.px=clamp(game.px+(held('ArrowLeft')?-470*dt:0)+(held('ArrowRight')?470*dt:0),0,860);
        const ball=game.ball;ball.x+=ball.vx*60*dt;ball.y+=ball.vy*60*dt;
        if(ball.x<8||ball.x>952)ball.vx*=-1;if(ball.y<45)ball.vy=Math.abs(ball.vy);
        if(ball.vy>0&&overlap(ball.x-8,ball.y-8,16,16,game.px,488,100,14)){ball.vy=-Math.abs(ball.vy);ball.vx=clamp((ball.x-(game.px+50))/12,-6,6)}
        if(ball.y>H){loseLife();ball.x=game.px+50;ball.y=370;ball.vx=3;ball.vy=-4}
        for(const brick of game.bricks)if(brick.alive&&overlap(ball.x-7,ball.y-7,14,14,brick.x,brick.y,56,21)){brick.alive=false;ball.vy*=-1;game.score+=10;break}
        if(game.bricks.every(brick=>!brick.alive)){game.cleared=true;saveScore();fadeMusic()}
      }
      if(selected===4){
        game.px=clamp(game.px+(held('ArrowLeft')?-310*dt:0)+(held('ArrowRight')?310*dt:0),0,920);
        game.py=clamp(game.py+(held('ArrowUp')?-310*dt:0)+(held('ArrowDown')?310*dt:0),74,485);
        if(held('Space','Enter')&&game.cool===0){game.shots.push({x:game.px+18,y:game.py});game.cool=.12}
        if(Math.random()<dt*1.3)game.enemies.push({x:random(30,920),y:-30});
        for(const shot of game.shots)shot.y-=480*dt;
        for(const enemy of game.enemies){enemy.y+=150*dt;if(overlap(game.px,game.py,30,34,enemy.x,enemy.y,32,28)){enemy.y=700;loseLife()}for(const shot of game.shots)if(overlap(shot.x,shot.y,7,16,enemy.x,enemy.y,32,28)){enemy.y=700;shot.y=-100;game.score+=10}}
        game.shots=game.shots.filter(shot=>shot.y>-30);game.enemies=game.enemies.filter(enemy=>enemy.y<600);
      }
      if(selected===5){
        let direction=game.next;
        if(pressed('ArrowLeft')&&game.dir.x!==1)direction={x:-1,y:0};
        if(pressed('ArrowRight')&&game.dir.x!==-1)direction={x:1,y:0};
        if(pressed('ArrowUp')&&game.dir.y!==1)direction={x:0,y:-1};
        if(pressed('ArrowDown')&&game.dir.y!==-1)direction={x:0,y:1};
        game.next=direction;game.step+=dt;
        if(game.step>.12){
          game.step=0;game.dir=game.next;
          const head={x:game.snake[0].x+game.dir.x,y:game.snake[0].y+game.dir.y};
          const eating=head.x===game.food.x&&head.y===game.food.y;
          if(head.x<0||head.x>=40||head.y<0||head.y>=22||game.snake.slice(0,eating?undefined:-1).some(part=>part.x===head.x&&part.y===head.y)){game.over=true;saveScore()}
          else{
            game.snake.unshift(head);
            if(eating){
              game.score+=10;let free=[];
              for(let y=0;y<22;y++)for(let x=0;x<40;x++)if(!game.snake.some(part=>part.x===x&&part.y===y))free.push({x,y});
              if(free.length)game.food=free[Math.floor(Math.random()*free.length)];else{game.over=true;game.win=true;saveScore()}
            }else game.snake.pop();
          }
        }
      }
      if(selected===6){
        game.px=clamp(game.px+(held('ArrowLeft')?-390*dt:0)+(held('ArrowRight')?390*dt:0),20,845);
        if(Math.random()<dt*1.7)game.objects.push({x:random(40,920),y:-24,bad:Math.random()<.2,hit:false});

        game.objects=game.objects.filter(object=>object.y<600);
      }
      if(game.over||game.cleared)fadeMusic();
      if(game.cleared&&action())nextStage();
    }

    }
    function loop(now){
      const dt=Math.min(.035,(now-last)/1000||.016);last=now;
      update(dt);draw();
      justPressed.clear();
      requestAnimationFrame(loop);
    }
    function normalize(key){return key===' '?'Space':key==='NumpadEnter'?'Enter':key==='p'||key==='P'?'KeyP':key}
    document.addEventListener('keydown',event=>{
      const key=normalize(event.key);
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','Escape','Backspace'].includes(key))event.preventDefault();
      if(!keys[key])ensureAudio();
      if(!keys[key])justPressed.add(key);
      keys[key]=true;
    });
    document.addEventListener('keyup',event=>keys[normalize(event.key)]=false);
    window.addEventListener('blur',()=>{for(const key in keys)keys[key]=false;justPressed.clear()});
    document.querySelectorAll('button[data-key]').forEach(button=>{
      const key=button.dataset.key;
      button.addEventListener('pointerdown',event=>{event.preventDefault();ensureAudio();keys[key]=true;justPressed.add(key);button.setPointerCapture(event.pointerId)});
      for(const eventName of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(eventName,()=>keys[key]=false);
    });
    musicButton.addEventListener('click',toggleMusic);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
