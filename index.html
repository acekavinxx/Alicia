<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>家庭游戏乐园 · 7款像素小游戏</title><style>
*{box-sizing:border-box}body{margin:0;background:#101323;color:white;font-family:monospace;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;background:#121b35}#hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font:14px monospace;color:#c7d3ef;pointer-events:none;text-shadow:1px 1px #000}#touch{position:fixed;bottom:38px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;pointer-events:none}.cluster{display:flex;gap:8px}button{pointer-events:auto;background:#263b65c9;border:2px solid #8eabdd;color:white;border-radius:10px;font:bold 23px monospace;min-width:53px;height:48px;touch-action:none}button:active{background:#5279b4}@media(hover:hover) and (pointer:fine){#touch{opacity:.25}#touch:hover{opacity:1}}</style></head><body><canvas id="c" width="640" height="360"></canvas><div id="hint">方向键移动 · OK/空格 操作 · 返回/Esc 回大厅 · P 暂停</div><div id="touch"><div class="cluster"><button data-k="ArrowLeft">◀</button><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div><div class="cluster"><button data-k="Escape">↩</button><button data-k="Space">OK</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const W=640,H=360;let scene='menu',choice=0,game=null,paused=false,keys={},prev={},tick=0,last=0,hi={};
try{hi=JSON.parse(localStorage.getItem('pixelHi')||'{}')}catch(e){}
const names=['极速赛车','像素突击','跳跃冒险','打砖块','飞机大战','贪吃蛇','接水果'],icons=['🏎️','🔫','🍄','🧱','🚀','🐍','🍎'],colors=['#fa7595','#f7b34a','#6fe1a0','#77c8fa','#c99cff'];
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function txt(s,a,b,size=15,col='#fff',align='left'){x.fillStyle=col;x.font=`bold ${size}px monospace`;x.textAlign=align;x.fillText(s,a,b)}
function pressed(k){return !!keys[k]&&!prev[k]}function down(...ks){return ks.some(k=>keys[k])}function action(){return pressed('Space')||pressed('Enter')||pressed('OK')}function ground(){rect(0,315,640,45,'#31564c');for(let i=0;i<640;i+=28)rect(i,315,15,4,'#4d9b70')}

function start(i){choice=i;scene='play';paused=false;tick=0;game={score:0,life:3,t:0,over:false,win:false,px:300,py:280,vx:0,vy:0,objs:[],shots:[],enemies:[],balls:[],level:1,cool:0};if(i===3){game.px=280;game.ball={x:320,y:230,vx:2.5,vy:-3};game.bricks=[];for(let r=0;r<5;r++)for(let col=0;col<11;col++)game.bricks.push({x:28+col*53,y:52+r*21,alive:true,c:r})}if(i===2){game.px=55;game.py=280;game.coins=[110,190,270,360,450,550].map((v,j)=>({x:v,y:j%2?218:275,got:false}));game.enemies=[{x:240,dir:1},{x:480,dir:-1}]}if(i===1){game.px=45;game.py=280;game.enemies=[]}if(i===4){game.px=300;game.py=290;game.life=3}if(i===5){game.snake=[{x:12,y:9},{x:11,y:9},{x:10,y:9}];game.dir={x:1,y:0};game.next={x:1,y:0};game.food={x:20,y:9};game.step=0;game.life=1}if(i===6){game.px=300;game.life=3}}
function save(){hi[choice]=Math.max(hi[choice]||0,game.score);try{localStorage.setItem('pixelHi',JSON.stringify(hi))}catch(e){}}
function lose(){game.life--;if(game.life<=0){game.over=true;save()}}function hit(a,b,w,h,c,d,e,f){return a<c+e&&a+w>c&&b<d+f&&b+h>d}
function update(dt){if(scene==='menu'){if(pressed('ArrowLeft')||pressed('ArrowUp'))choice=(choice+6)%7;if(pressed('ArrowRight')||pressed('ArrowDown'))choice=(choice+1)%7;if(action())start(choice);return}if(pressed('Escape')||pressed('Backspace')){scene='menu';return}if(pressed('KeyP'))paused=!paused;if(paused)return;if(game.over){if(action())start(choice);return}let g=game;g.t+=dt;g.cool=Math.max(0,g.cool-dt);tick++;
if(choice===0){g.px=clamp(g.px+(down('ArrowLeft')?-260*dt:0)+(down('ArrowRight')?260*dt:0),145,460);if(Math.random()<dt*(1.7+g.score/120)){g.objs.push({x:[165,245,325,405][Math.floor(Math.random()*4)],y:-55,c:Math.random()>.5?'#ef6687':'#f6c35f'})}for(const o of g.objs){o.y+=(155+g.score*0.8)*dt;if(hit(g.px,270,34,57,o.x,o.y,36,56)){o.y=500;lose()}if(o.y>365&&!o.done){o.done=true;g.score+=5}}g.objs=g.objs.filter(o=>o.y<420)}
if(choice===1){g.px=clamp(g.px+(down('ArrowLeft')?-160*dt:0)+(down('ArrowRight')?160*dt:0),5,610);if(down('ArrowUp')&&g.py>=279)g.vy=-310;g.vy+=850*dt;g.py=clamp(g.py+g.vy*dt,0,280);if(g.py===280)g.vy=0;if(down('Space','Enter','OK')&&g.cool===0){g.shots.push({x:g.px+25,y:g.py+16});g.cool=.18}if(Math.random()<dt*.8)g.enemies.push({x:650,y:280});for(const s of g.shots)s.x+=380*dt;for(const e of g.enemies){e.x-=65*dt;if(hit(g.px,g.py,22,35,e.x,e.y,24,35)){e.x=-100;lose()}for(const s of g.shots)if(hit(s.x,s.y,10,5,e.x,e.y,24,35)){e.x=-100;s.x=800;g.score+=10}}g.enemies=g.enemies.filter(e=>e.x>-40);g.shots=g.shots.filter(s=>s.x<650)}
if(choice===2){g.px=clamp(g.px+(down('ArrowLeft')?-155*dt:0)+(down('ArrowRight')?155*dt:0),0,612);if((down('Space','Enter','ArrowUp','OK'))&&g.py>=280)g.vy=-340;g.vy+=900*dt;g.py=Math.min(280,g.py+g.vy*dt);if(g.py===280)g.vy=0;for(const a of g.coins)if(!a.got&&hit(g.px,g.py,24,34,a.x,a.y,13,13)){a.got=true;g.score+=10}for(const e of g.enemies){e.x+=e.dir*60*dt;if(e.x<190||e.x>580)e.dir*=-1;if(hit(g.px,g.py,24,34,e.x,288,24,26)){g.px=35;lose()}}if(g.coins.every(a=>a.got)){g.win=true;g.over=true;save()}}
if(choice===3){g.px=clamp(g.px+(down('ArrowLeft')?-320*dt:0)+(down('ArrowRight')?320*dt:0),0,550);let b=g.ball;b.x+=b.vx*60*dt;b.y+=b.vy*60*dt;if(b.x<7||b.x>633)b.vx*=-1;if(b.y<9)b.vy=Math.abs(b.vy);if(b.vy>0&&hit(b.x-6,b.y-6,12,12,g.px,322,90,13)){b.vy=-Math.abs(b.vy);b.vx=clamp((b.x-(g.px+45))/11,-5,5)}if(b.y>360){lose();b.x=g.px+45;b.y=260;b.vx=2.5;b.vy=-3}for(const a of g.bricks)if(a.alive&&hit(b.x-5,b.y-5,10,10,a.x,a.y,47,16)){a.alive=false;b.vy*=-1;g.score+=10;break}if(g.bricks.every(a=>!a.alive)){g.over=true;g.win=true;save()}}
if(choice===4){g.px=clamp(g.px+(down('ArrowLeft')?-220*dt:0)+(down('ArrowRight')?220*dt:0),0,610);g.py=clamp(g.py+(down('ArrowUp')?-220*dt:0)+(down('ArrowDown')?220*dt:0),65,310);if(down('Space','Enter','OK')&&g.cool===0){g.shots.push({x:g.px+11,y:g.py});g.cool=.13}if(Math.random()<dt*1.6)g.enemies.push({x:rnd(30,600),y:-20});for(const s of g.shots)s.y-=360*dt;for(const e of g.enemies){e.y+=95*dt;if(hit(g.px,g.py,24,30,e.x,e.y,26,26)){e.y=500;lose()}for(const s of g.shots)if(hit(s.x,s.y,5,12,e.x,e.y,26,26)){e.y=500;s.y=-100;g.score+=10}}g.shots=g.shots.filter(s=>s.y>-30);g.enemies=g.enemies.filter(e=>e.y<380)}
if(choice===5){let d=g.next;if(pressed('ArrowLeft')&&g.dir.x!==1)d={x:-1,y:0};if(pressed('ArrowRight')&&g.dir.x!==-1)d={x:1,y:0};if(pressed('ArrowUp')&&g.dir.y!==1)d={x:0,y:-1};if(pressed('ArrowDown')&&g.dir.y!==-1)d={x:0,y:1};g.next=d;g.step+=dt;if(g.step>.135){g.step=0;g.dir=g.next;let h={x:g.snake[0].x+g.dir.x,y:g.snake[0].y+g.dir.y};let eating=h.x===g.food.x&&h.y===g.food.y;if(h.x<0||h.x>=32||h.y<0||h.y>=15||g.snake.slice(0,eating?undefined:-1).some(z=>z.x===h.x&&z.y===h.y)){g.over=true;save()}else{g.snake.unshift(h);if(eating){g.score+=10;let free=[];for(let yy=0;yy<15;yy++)for(let xx=0;xx<32;xx++)if(!g.snake.some(z=>z.x===xx&&z.y===yy))free.push({x:xx,y:yy});if(free.length)g.food=free[Math.floor(Math.random()*free.length)];else{g.over=true;g.win=true;save()}}else g.snake.pop()}}}
if(choice===6){g.px=clamp(g.px+(down('ArrowLeft')?-260*dt:0)+(down('ArrowRight')?260*dt:0),12,552);if(Math.random()<dt*2.2)g.objs.push({x:rnd(30,605),y:-15,bad:Math.random()<.23,hit:false});for(const o of g.objs){o.y+=135*dt;if(!o.hit&&hit(g.px,309,75,24,o.x,o.y,20,20)){o.hit=true;o.y=450;if(o.bad)lose();else g.score+=10}}g.objs=g.objs.filter(o=>o.y<380)}
}
function car(a,b,col){rect(a+5,b,25,55,col);rect(a+9,b+8,17,12,'#b6e6fb');rect(a+9,b+31,17,11,'#b6e6fb');rect(a+2,b+9,4,12,'#14192d');rect(a+30,b+9,4,12,'#14192d')}
function draw(){rect(0,0,640,360,'#101b35');if(scene==='menu'){for(let i=0;i<55;i++)rect((i*103)%640,(i*67)%360,2,2,'#385074');txt('🎮 家庭游戏乐园',320,42,27,'#fff','center');txt('选择一个游戏开始冒险！',320,67,14,'#bed2ef','center');for(let i=0;i<7;i++){let col=i%3,row=Math.floor(i/3),a=51+col*183,b=83+row*78;box(a,b,170,68,i===choice?'#456b9d':'#29456e');txt(icons[i],a+85,b+29,23,'#fff','center');txt(names[i],a+85,b+54,15,'#fff','center');if(i===choice){rect(a,b,170,3,'#ffe18b');rect(a,b+65,170,3,'#ffe18b')}}txt('◀ ▶ 选择游戏   ·   OK 开始',320,342,13,'#c6d8fc','center');return}let g=game;
if(choice===0){rect(105,0,430,360,'#313a54');rect(135,0,370,360,'#353e59');for(let j=1;j<4;j++)for(let i=0;i<8;i++)rect(135+j*92,((i*60+tick*3)%420)-60,4,32,'#d5d9df');rect(132,0,6,360,'#f8b864');rect(503,0,6,360,'#f8b864');for(const o of g.objs)car(o.x,o.y,o.c);car(g.px,270,'#55d8e6')}
if(choice===1){ground();for(let i=0;i<6;i++)rect(i*120+25,180+(i%2)*20,55,135,'#273c57');rect(g.px,g.py,22,35,'#6ae1ad');rect(g.px+18,g.py+12,14,6,'#ffdc7b');for(const e of g.enemies){rect(e.x,e.y,24,35,'#f17a7c');rect(e.x+4,e.y+6,5,5,'#fff')}for(const s of g.shots)rect(s.x,s.y,10,5,'#ffe66e')}
if(choice===2){rect(0,0,640,315,'#4d83a0');for(let i=0;i<6;i++)rect(i*120+15,45,70,18,'#e1f2fa');ground();for(const a of g.coins)if(!a.got){rect(a.x,a.y,13,13,'#ffdc52');rect(a.x+4,a.y+2,5,9,'#fff1aa')}rect(g.px,g.py,24,34,'#ed6f70');rect(g.px+4,g.py-7,18,10,'#b63c50');rect(g.px+15,g.py+9,5,5,'#fff');for(const e of g.enemies){rect(e.x,288,24,26,'#825b9c');rect(e.x+5,293,5,5,'#fff')}}
if(choice===3){for(const a of g.bricks)if(a.alive){rect(a.x,a.y,47,16,['#f47491','#f6ac65','#f6d86c','#73dba7','#6bb6e7'][a.c]);rect(a.x,a.y,47,3,'#ffffff66')}rect(g.px,322,90,13,'#82d7ed');rect(g.ball.x-5,g.ball.y-5,10,10,'#fff3ad')}
if(choice===5){rect(0,33,640,327,'#1d324b');for(let yy=0;yy<15;yy++)for(let xx=0;xx<32;xx++)if((xx+yy)%2===0)rect(xx*20,40+yy*20,20,20,'#243c54');rect(g.food.x*20+3,40+g.food.y*20+3,14,14,'#f77679');for(let j=g.snake.length-1;j>=0;j--){let z=g.snake[j];rect(z.x*20+2,40+z.y*20+2,16,16,j===0?'#c6f17c':'#6cdb95')}}
if(choice===6){rect(0,33,640,327,'#26425d');for(let i=0;i<18;i++)rect(i*41,60+(i%3)*30,4,4,'#618aa3');for(const o of g.objs){rect(o.x,o.y,20,20,o.bad?'#e44d68':'#f3aa59');rect(o.x+5,o.y+3,10,8,o.bad?'#31243d':'#78dd8d')}rect(g.px,310,75,20,'#e6c181');rect(g.px+7,303,61,9,'#b87a4d')}
if(choice===4){for(let i=0;i<50;i++)rect((i*79)%640,((i*43+tick*2)%360),2,3,'#8dadd6');rect(g.px+8,g.py-10,9,39,'#75e7f2');rect(g.px,g.py+9,25,13,'#7f95f5');rect(g.px+10,g.py-15,5,8,'#f7d66a');for(const e of g.enemies){rect(e.x+7,e.y,12,26,'#f276a5');rect(e.x,e.y+10,27,9,'#d34d85')}for(const s of g.shots)rect(s.x,s.y,5,12,'#ffe483')}
rect(0,0,640,33,'#101b35d9');txt(names[choice],15,23,17,'#ffdd91');txt('分数 '+g.score,310,23,16,'#fff','center');txt('生命 '+ '♥'.repeat(Math.max(0,g.life)),620,23,16,'#ff8a99','right');
if(paused||g.over){rect(130,103,380,150,'#172847');box(130,103,380,150,'#253c66');txt(paused?'已暂停':g.win?'恭喜通关！':'游戏结束',320,158,27,'#ffdc86','center');txt(paused?'按 P 继续':'按 OK 再玩一次',320,202,18,'#fff','center');txt('按返回键回到大厅',320,233,13,'#c6d6ef','center')}}
function loop(now){let dt=Math.min(.035,(now-last)/1000||.016);last=now;update(dt);draw();prev={...keys};requestAnimationFrame(loop)}requestAnimationFrame(loop);
function normalize(k){return k===' '?'Space':k==='NumpadEnter'?'Enter':k}document.addEventListener('keydown',e=>{let k=normalize(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','Escape','Backspace'].includes(k))e.preventDefault();keys[k]=true});document.addEventListener('keyup',e=>keys[normalize(e.key)]=false);window.addEventListener('blur',()=>{keys={};prev={}});document.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});
</script></body></html>
